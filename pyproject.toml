[build-system]
requires = ["setuptools", "setuptools-scm[simple]"]
build-backend = "setuptools.build_meta"

[project]
name = "wiktionary_stardict"
version = "0.1.0"
authors = [{ name = "xxyzz" }]
description = "Free dictionaries"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
dependencies = [
    "saxonche",
    "requests",
    "python-idzip",
    "libzim",
    "mediawiki_langcodes",
]

[project.optional-dependencies]
dev = ["ruff", "beautifulsoup4", "pycountry"]

[project.scripts]
dict = "wiktionary_stardict.main:main"
